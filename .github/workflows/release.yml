name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract uploaded ZIPs and auto-commit
        shell: bash
        run: |
          shopt -s nullglob
          zips=( *.zip patches/*.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Force-extracting $z..."
              unzip -o -q "$z" -d . -x ".github/workflows/*"
              rm -f "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: extract uploaded zip patches [skip ci]"
              git pull --rebase origin ${{ github.ref_name }}
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "No ZIP files found to extract."
          fi

      - name: Sync branch before semantic-release
        shell: bash
        run: |
          git fetch origin ${{ github.ref_name }} --tags
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install release dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests before release
        run: ./gradlew :extensions:soundcloud:testDebugUnitTest --no-daemon

      - name: Semantic Release (Tag, Metadata & .mpp Asset)
        uses: cycjimmy/semantic-release-action@v8
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android DEX into MPP bundle
        run: |
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          bash .github/scripts/verify_mpp.sh

      - name: Attest build provenance (public repos)
        if: steps.release.outputs.new_release_published == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'SoundCloud Combined Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Upload built MPP artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: morphe-patches-mpp
          path: |
            patches/build/libs/patches-*.mpp
            !patches/build/libs/patches-*-sources.mpp
            !patches/build/libs/patches-*-javadoc.mpp
